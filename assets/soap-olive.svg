<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Olive and oat soap bar</title>
  <desc id="desc">A pale cream soap bar with oat stems on a soft sage background.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="800" fill="#bdc3a8"/>
  <path d="M0 0h640v190H0z" fill="#cbd0b8" opacity=".7"/>
  <path d="M0 610h640v190H0z" fill="#a8b092" opacity=".45"/>
  <g fill="none" stroke="#777b4d" stroke-linecap="round">
    <path d="M348 102c-13 116-11 224 7 323" stroke-width="3"/>
    <path d="M353 147c-30-20-43-49-39-86" stroke-width="2.5"/>
    <path d="M353 197c-31-9-49-32-54-68" stroke-width="2.5"/>
    <path d="M354 245c-28-12-44-36-46-72" stroke-width="2.5"/>
    <path d="M354 149c26-14 41-37 45-68" stroke-width="2.5"/>
    <path d="M354 202c29-5 48-27 57-60" stroke-width="2.5"/>
    <path d="M354 252c27-2 46-21 56-52" stroke-width="2.5"/>
    <path d="M359 314c-20-18-29-42-25-70" stroke-width="2.5"/>
    <path d="M359 320c22-10 36-29 42-54" stroke-width="2.5"/>
  </g>
  <g opacity=".28" filter="url(#shadow)" fill="#5e6447">
    <ellipse cx="300" cy="645" rx="213" ry="44"/>
  </g>

  <g transform="translate(102 350) rotate(4 220 125)">
    <rect x="0" y="30" width="440" height="180" rx="20" fill="#c7b99d"/>
    <rect x="0" y="0" width="440" height="171" rx="20" fill="#eae0c9"/>
    <path d="M20 0h400a20 20 0 0 1 20 20v8H0v-8A20 20 0 0 1 20 0z" fill="#f5edda" opacity=".7"/>
    <g opacity=".3" fill="#a39a77">
      <ellipse cx="82" cy="64" rx="15" ry="5"/><ellipse cx="142" cy="132" rx="9" ry="3.5"/>
      <ellipse cx="221" cy="74" rx="12" ry="4"/><ellipse cx="305" cy="124" rx="16" ry="5.5"/>
      <ellipse cx="372" cy="58" rx="8" ry="3"/><ellipse cx="49" cy="130" rx="7" ry="2.6"/>
    </g>
    <rect x="72" y="44" width="296" height="74" rx="37" fill="none" stroke="#b7aa8b" stroke-width="1" opacity=".48"/>
    <text x="220" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="27" letter-spacing="14" fill="#b2a789" opacity=".8">SORREL</text>
    <text x="220" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="3.3" fill="#a99e80" opacity=".95">OLIVE + OAT</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#41463a">
    <text x="42" y="52" font-size="10" letter-spacing="3.2">NO. 02</text>
    <text x="598" y="52" text-anchor="end" font-size="10" letter-spacing="3.2">SORREL</text>
    <path d="M42 70h110" stroke="#41463a" stroke-width="1" opacity=".45"/>
    <text x="42" y="734" font-family="Georgia, serif" font-size="25" letter-spacing=".5">Olive + Oat</text>
    <text x="42" y="758" font-size="9" letter-spacing="2.5" opacity=".7">UNSCENTED / SOFT / 120 G</text>
    <text x="598" y="758" text-anchor="end" font-size="9" letter-spacing="2.2" opacity=".7">COLD PROCESS</text>
  </g>
  <rect width="640" height="800" filter="url(#grain)" opacity=".45" style="mix-blend-mode:multiply"/>
