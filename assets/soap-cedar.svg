    <rect x="0" y="0" width="420" height="170" rx="17" fill="#374232"/>
    <path d="M18 0h384a18 18 0 0 1 18 18v11H0V18A18 18 0 0 1 18 0z" fill="#546049" opacity=".55"/>
    <g fill="#c3b997" opacity=".2">
      <circle cx="55" cy="66" r="2.2"/><circle cx="92" cy="127" r="1.7"/><circle cx="146" cy="83" r="2.5"/>
      <circle cx="194" cy="137" r="1.9"/><circle cx="259" cy="54" r="2.1"/><circle cx="317" cy="124" r="1.8"/>
