    <path d="M471 172c-34 1-59-15-74-47" stroke-width="3"/>
    <path d="M472 218c-33 8-61-5-81-36" stroke-width="3"/>
    <path d="M469 269c-34 8-63-3-86-33" stroke-width="3"/>
    <path d="M457 323c-32 6-59-6-78-34" stroke-width="3"/>
    <path d="M470 124c33-17 50-42 51-75" stroke-width="3"/>
    <path d="M470 168c33 0 56-15 69-45" stroke-width="3"/>
