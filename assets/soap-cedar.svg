<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">Cedar and vetiver soap bar</title>
  <desc id="desc">A charcoal soap bar with a cedar sprig on a warm ochre background.</desc>
  <defs>
