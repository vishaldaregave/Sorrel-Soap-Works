      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="800" fill="#c5a77c"/>
  <path d="M0 0h640v210H0z" fill="#d1b58a" opacity=".6"/>
  <path d="M0 600h640v200H0z" fill="#b49267" opacity=".5"/>
  <g fill="none" stroke="#5a5e3f" stroke-linecap="round">
