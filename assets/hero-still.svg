    <path d="M135 306c36 7 62-8 83-41" stroke-width="4"/>
    <path d="M86 174c-35-12-52-38-49-75" stroke-width="4"/>
    <path d="M132 212c29-22 35-52 20-90" stroke-width="4"/>
    <path d="M164 259c-2-43 16-74 51-92" stroke-width="4"/>
    <path d="M188 320c30-17 44-43 40-79" stroke-width="4"/>
  </g>

  <g transform="translate(122 182)" fill="none" stroke="#7a7351" stroke-linecap="round">
    <path d="M22 260c17-90 43-166 95-239" stroke-width="3"/>
    <path d="M52 186c-31-8-47-28-49-60" stroke-width="2"/>
    <path d="M62 148c-26-14-37-35-32-63" stroke-width="2"/>
    <path d="M75 112c-19-18-23-40-10-65" stroke-width="2"/>
