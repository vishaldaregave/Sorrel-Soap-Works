    <text x="226" y="89" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="13" fill="#762f22" opacity=".7">SORREL</text>
    <text x="226" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="3.2" fill="#7d3828" opacity=".8">ROSE + PINK CLAY</text>
