  </g>

  <g font-family="Arial, sans-serif" fill="#493f32">
    <text x="66" y="838" font-size="10" letter-spacing="3">SMALL BATCH / 014</text>
    <text x="66" y="862" font-family="Georgia, serif" font-size="26" letter-spacing="1">Cedar, olive, clay.</text>
    <text x="66" y="888" font-size="9" letter-spacing="2.5" opacity=".7">CURED SIX WEEKS / CUT BY HAND</text>
    <text x="744" y="862" text-anchor="end" font-size="9" letter-spacing="2.5" opacity=".65">SORREL SOAP WORKS</text>
  </g>

  <rect width="800" height="1000" filter="url(#grain)" opacity=".5" style="mix-blend-mode:multiply"/>
