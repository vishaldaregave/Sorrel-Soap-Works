    <text x="210" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="3.4" fill="#b4a182">OLIVE + OAT / 120 G</text>
  </g>

  <g transform="translate(290 440) rotate(5 250 140)">
