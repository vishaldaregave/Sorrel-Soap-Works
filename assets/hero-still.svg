    <path d="M49 193c-35 1-54-22-59-61" stroke-width="4"/>
    <path d="M69 214c-3-39 17-66 55-82" stroke-width="4"/>
    <path d="M91 240c37 6 61-10 79-45" stroke-width="4"/>
