<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated soap still life</title>
  <desc id="desc">Three hand-cut soap bars stacked on a plaster shelf with cedar and dried grasses.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd0bb"/>
      <stop offset="1" stop-color="#cebca2"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b89b77"/>
      <stop offset="1" stop-color="#9e805f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>
  <path d="M0 0h800v710H0z" fill="#d8c9b3"/>
  <path d="M92 0h420l-88 710H0V96z" fill="#e4d7c2" opacity=".55"/>
  <rect y="704" width="800" height="296" fill="url(#table)"/>
  <path d="M0 704h800" stroke="#8b6f51" stroke-width="2" opacity=".55"/>
  <path d="M0 760h800" stroke="#cfb38b" stroke-width="1" opacity=".22"/>

  <g opacity=".3" fill="none" stroke="#ae9678" stroke-width="7" stroke-linecap="round">
    <path d="M578 0c-9 130 17 217 91 289 48 47 65 88 66 145"/>
    <path d="M664 116c-33 4-57-14-77-52"/>
    <path d="M680 189c-39 1-67-19-88-58"/>
    <path d="M692 259c-33-2-59-24-76-57"/>
    <path d="M712 335c-27-5-48-23-63-51"/>
    <path d="M727 413c-24-8-42-27-53-53"/>
    <path d="M596 97c38 1 64-15 78-35"/>
    <path d="M642 167c42 3 70-12 87-38"/>
  </g>

  <g opacity=".22" filter="url(#soft)" fill="#5d4d39">
    <ellipse cx="415" cy="780" rx="245" ry="50"/>
    <ellipse cx="270" cy="832" rx="180" ry="30"/>
  </g>

  <g transform="translate(92 294) rotate(-8 280 150)">
    <rect x="0" y="30" width="420" height="182" rx="21" fill="#c9b797"/>
    <rect x="0" y="0" width="420" height="175" rx="21" fill="#e7dac1"/>
    <path d="M22 0h376a21 21 0 0 1 21 21v9H1v-9A21 21 0 0 1 22 0z" fill="#f0e6d1" opacity=".7"/>
